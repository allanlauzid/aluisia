<meta name="description" content="Painel de administração da Aluisia, assistente virtual de atendimento via WhatsApp.">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>

<div id="gate">
  <form class="gate-form" id="gate-form" autocomplete="off" novalidate>
    <label for="gate-input" class="sr-only" id="gate-label">Últimos 4 dígitos do seu WhatsApp ou código do autenticador</label>
    <div class="gate-field">
      <input id="gate-input" class="mascarado" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="8" aria-describedby="gate-status">
      <button type="button" class="gate-btn" id="gate-olho" aria-label="Mostrar números" aria-pressed="false">
        <svg id="olho-aberto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg id="olho-fechado" hidden width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
      </button>
      <button type="submit" class="gate-btn go" id="gate-go" aria-label="Continuar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <p id="gate-status" class="sr-only" aria-live="polite"></p>
  </form>
  <div class="intro-login" id="intro" aria-hidden="true">
    <div class="marca"><span class="anel"></span><img src="logotipo.svg" alt="" width="560" height="120"></div>
    <p class="ola">Olá, <em id="intro-nome"></em></p>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/"><img src="img/aluisia-avatar.webp" alt="" width="30" height="30"><span class="brand-name">Aluisia</span></a>
      <nav class="topnav" aria-label="Principal">
        <a href="#/" data-rota="inicio">Início</a>
        <a href="#/painel" data-rota="painel">Painel</a>
        <a href="#/docs" data-rota="docs">Documentação</a>
      </nav>
      <span class="spacer"></span>
      <span class="user-chip"><span class="dot" aria-hidden="true"></span><span class="nome" id="user-nome"></span></span>
      <button type="button" class="btn-sair" id="btn-sair" aria-label="Sair">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span class="txt">Sair</span>
      </button>
    </div>
  </header>

  <div id="view"></div>

  <footer class="site-footer">
    <span class="footer-brand"><img src="logo.svg" alt="" width="22" height="22"><span class="brand-name" style="color: var(--ink);">Assistente Virtual Aluisia</span></span> &middot; Painel de administração &middot; <a href="privacidade.html">Política de privacidade</a>
  </footer>

  <nav class="tabbar" aria-label="Navegação">
    <a href="#/" data-rota="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
    <a href="#/painel/duvidas" data-rota="duvidas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>Dúvidas<span class="cont" id="tab-cont" hidden></span></a>
    <a href="#/painel/base" data-rota="base"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Base</a>
    <a href="#/painel" data-rota="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Painel</a>
    <a href="#/docs" data-rota="docs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>Ajuda</a>
  </nav>
</div>

<div id="toast" role="status" aria-live="polite">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
  <span id="toast-text"></span>
</div>

<div id="back-to-top-wrap">
  <svg class="ring" width="64" height="64" viewBox="0 0 64 64"><circle class="ring-bg" cx="32" cy="32" r="28"></circle><circle class="ring-fg" id="ring-fg" cx="32" cy="32" r="28"></circle></svg>
  <button id="back-to-top" aria-label="Voltar ao topo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg></button>
</div>
